<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080412"/>
      <stop offset="55%" stop-color="#0b0719"/>
      <stop offset="100%" stop-color="#0d0822"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#2563eb" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="0" x2="800" y2="0"/><line x1="0" y1="38" x2="800" y2="38"/><line x1="0" y1="76" x2="800" y2="76"/><line x1="0" y1="114" x2="800" y2="114"/><line x1="0" y1="152" x2="800" y2="152"/><line x1="0" y1="190" x2="800" y2="190"/><line x1="0" y1="228" x2="800" y2="228"/><line x1="0" y1="266" x2="800" y2="266"/><line x1="0" y1="304" x2="800" y2="304"/><line x1="0" y1="342" x2="800" y2="342"/><line x1="0" y1="380" x2="800" y2="380"/><line x1="0" y1="418" x2="800" y2="418"/><line x1="0" y1="456" x2="800" y2="456"/><line x1="0" y1="494" x2="800" y2="494"/><line x1="0" y1="532" x2="800" y2="532"/><line x1="0" y1="570" x2="800" y2="570"/><line x1="0" y1="608" x2="800" y2="608"/>
    <line x1="0" y1="0" x2="0" y2="600"/><line x1="38" y1="0" x2="38" y2="600"/><line x1="76" y1="0" x2="76" y2="600"/><line x1="114" y1="0" x2="114" y2="600"/><line x1="152" y1="0" x2="152" y2="600"/><line x1="190" y1="0" x2="190" y2="600"/><line x1="228" y1="0" x2="228" y2="600"/><line x1="266" y1="0" x2="266" y2="600"/><line x1="304" y1="0" x2="304" y2="600"/><line x1="342" y1="0" x2="342" y2="600"/><line x1="380" y1="0" x2="380" y2="600"/><line x1="418" y1="0" x2="418" y2="600"/><line x1="456" y1="0" x2="456" y2="600"/><line x1="494" y1="0" x2="494" y2="600"/><line x1="532" y1="0" x2="532" y2="600"/><line x1="570" y1="0" x2="570" y2="600"/><line x1="608" y1="0" x2="608" y2="600"/><line x1="646" y1="0" x2="646" y2="600"/><line x1="684" y1="0" x2="684" y2="600"/><line x1="722" y1="0" x2="722" y2="600"/><line x1="760" y1="0" x2="760" y2="600"/><line x1="798" y1="0" x2="798" y2="600"/>
  </g>

  <!-- glow blobs -->
  <circle cx="196" cy="77" r="170" fill="url(#glow1)" filter="url(#blur)"/>
  <circle cx="553" cy="413" r="150" fill="url(#glow2)" filter="url(#blur)"/>

  <!-- accent orb top-right -->
  <circle cx="660" cy="110" r="90" fill="#60a5fa" fill-opacity="0.14" filter="url(#blur)"/>

  <!-- main card -->
  <g filter="url(#cardShadow)">
    <rect x="150" y="140" width="500" height="320" rx="28" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
    <rect x="150" y="140" width="500" height="320" rx="28" fill="url(#accentGrad)" fill-opacity="0.06"/>
    <!-- card top bar -->
    <line x1="150" y1="200" x2="650" y2="200" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
    <!-- mini dots -->
    <circle cx="182" cy="170" r="6" fill="#60a5fa"/>
    <circle cx="206" cy="170" r="6" fill="#ffffff" fill-opacity="0.15"/>
    <circle cx="230" cy="170" r="6" fill="#ffffff" fill-opacity="0.15"/>
    <!-- icon circle -->
    <circle cx="400" cy="280" r="76" fill="url(#iconGrad)" fill-opacity="0.16" stroke="url(#iconGrad)" stroke-width="2"/>
    <circle cx="400" cy="280" r="90" fill="none" stroke="url(#iconGrad)" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4 8"/>
    <g transform="translate(400,280) scale(2.6) translate(-12,-12)">
      <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1.5"/><circle cx="19" cy="21" r="1.5"/><path d="M2 3h2l2.6 12.4A2 2 0 0 0 8.6 17H18a2 2 0 0 0 2-1.4L22 7H6"/></g>
    </g>
  </g>

  <!-- pill badge -->
  <rect x="330" y="360" width="140" height="34" rx="17" fill="#2563eb" fill-opacity="0.18" stroke="#2563eb" stroke-opacity="0.5"/>
  <text x="400" y="383" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="2" fill="#60a5fa">HEADLESS E-COMMERCE ENGINE</text>

  <!-- name -->
  <text x="400" y="450" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="1" fill="#f3f0ff">Swift Commerce</text>

  <!-- footer strip -->
  <text x="400" y="540" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="6" fill="#6d6488">DIGI VIP × PREMIUM</text>
</svg>